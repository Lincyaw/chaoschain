[project]
name = "chaoschain"
version = "0.1.0"
description = "Heterogeneous causal knowledge base for cascade fault chain mining."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = [
    "chaos-engineering",
    "fault-injection",
    "knowledge-graph",
    "causal-inference",
    "site-reliability",
    "observability",
]
authors = [
    { name = "lincyaw", email = "814750204@qq.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "typer>=0.25.1",
]

[project.urls]
Homepage = "https://github.com/lincyaw/chaoschain"
Repository = "https://github.com/lincyaw/chaoschain"
Issues = "https://github.com/lincyaw/chaoschain/issues"

[project.scripts]
chaoschain = "chaoschain.cli:app"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "types-pyyaml>=6.0.12.20260408",
    "build>=1.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x --tb=short"
